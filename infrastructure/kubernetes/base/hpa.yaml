apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{ type: Pods, value: 2, periodSeconds: 60 }]
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    # EXAMPLE external metric: requires prometheus-adapter or KEDA exposing the RabbitMQ/queue depth metric.
    # Metric name below maps to the CONTRACT gauge messaging.queue.depth (Prometheus: messaging_queue_depth).
    # Remove this block if no external-metrics provider is installed (HPA would report ScalingActive=False for it).
    - type: External
      external:
        metric:
          name: messaging_queue_depth
          selector:
            matchLabels: { priority: "all" }
        target: { type: AverageValue, averageValue: "2000" }
