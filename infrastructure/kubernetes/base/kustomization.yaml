apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: messaging
labels:
  - pairs:
      app.kubernetes.io/part-of: messaging-platform
    includeSelectors: false
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - secret.template.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
