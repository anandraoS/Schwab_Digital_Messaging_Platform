apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app.kubernetes.io/name: backend
data:
  SPRING_PROFILES_ACTIVE: "prod-like,rabbit"
  SERVER_PORT: "18080"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_VIRTUAL_HOST: "messaging"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/messaging"
  SPRING_DATA_REDIS_HOST: "redis"
  MESSAGING_BUS_TYPE: "rabbit"
  MESSAGING_COORDINATION_TYPE: "redis"
  MESSAGING_SECURITY_DEV_TOKEN_ENABLED: "false"
  MESSAGING_DISPATCH_CONCURRENCY: "8"
  MESSAGING_DISPATCH_PREFETCH: "16"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://otel-collector.observability:4318/v1/traces"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
  JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -Duser.timezone=UTC"
