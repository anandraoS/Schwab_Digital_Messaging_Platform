apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: messaging-dev
resources:
  - ../../base
  - dependencies.yaml
images:
  - name: messaging-backend
    newName: ghcr.io/example-org/messaging-backend
    newTag: dev
patches:
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: "1", memory: 768Mi }
  - target: { kind: HorizontalPodAutoscaler, name: backend }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
      # dev has no external-metrics provider: drop the queue-depth example metric
      - op: remove
        path: /spec/metrics/1
  - target: { kind: PodDisruptionBudget, name: backend }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
