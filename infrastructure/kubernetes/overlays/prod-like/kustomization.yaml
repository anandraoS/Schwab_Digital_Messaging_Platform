apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: messaging-prod-like
resources:
  - ../../base
images:
  - name: messaging-backend
    newName: ghcr.io/example-org/messaging-backend
    newTag: "1.0.0"   # replace with the immutable CI version, ideally pinned by digest
patches:
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: "1", memory: 1Gi }
          limits: { cpu: "2", memory: 1536Mi }
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
  - target: { kind: HorizontalPodAutoscaler, name: backend }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 12
  - target: { kind: PodDisruptionBudget, name: backend }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
  # Secrets must come from a secret manager (External Secrets / Sealed Secrets / Vault). Drop the dummy template.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: backend-secrets
