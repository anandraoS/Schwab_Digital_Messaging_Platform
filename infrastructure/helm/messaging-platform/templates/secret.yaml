{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# DUMMY template secret (values.yaml placeholders). Use secrets.existingSecret for anything real.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mp.fullname" . }}-secrets
  labels:
    {{- include "mp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
