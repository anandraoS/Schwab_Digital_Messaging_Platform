{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "mp.fullname" . }}
  labels:
    {{- include "mp.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "mp.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.cpuUtilization }}
    {{- if .Values.autoscaling.queueDepth.enabled }}
    - type: External
      external:
        metric:
          name: {{ .Values.autoscaling.queueDepth.metricName }}
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.queueDepth.averageValue | quote }}
    {{- end }}
{{- end }}
