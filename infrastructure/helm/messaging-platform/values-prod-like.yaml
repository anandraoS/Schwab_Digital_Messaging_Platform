replicaCount: 3

image:
  tag: "1.0.0"   # replace with the immutable CI version (or set digest via --set image.tag)

resources:
  requests: { cpu: "1", memory: 1Gi }
  limits: { cpu: "2", memory: 1536Mi }

secrets:
  create: false
  existingSecret: messaging-backend-secrets   # provided by External Secrets/Vault; NOT created by this chart

autoscaling:
  minReplicas: 3
  maxReplicas: 12
  queueDepth:
    enabled: true

pdb:
  minAvailable: 2

serviceMonitor:
  enabled: true
