# Dummy-credential demo broker. Definitions are imported at boot.
load_definitions = /etc/rabbitmq/definitions.json
# Memory/disk safety nets
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 500MB
# Queue behaviour
default_vhost = messaging
heartbeat = 30
consumer_timeout = 1800000
# Logging
log.console = true
log.console.level = info
# Management UI exposed on loopback only by compose
management.tcp.port = 15672
# Prometheus plugin may be enabled with: rabbitmq-plugins enable rabbitmq_prometheus
