  /api/v1/ops/summary:
    get:
      tags: [Queues]
      operationId: getOpsSummary
      summary: Dashboard aggregates for the last 24 hours
      responses:
        '200':
          description: Aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSummary'
  /api/v1/ops/consumers/pause:
    post:
      tags: [Queues]
