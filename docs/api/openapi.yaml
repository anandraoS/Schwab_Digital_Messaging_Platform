openapi: 3.0.3
info:
  title: Omnichannel Messaging and Notification Orchestration API
  version: 1.0.0
  description: |
    Synthetic-data reference platform. Providers are simulators: no real email, SMS or push is ever sent.

    Conventions
    * Base path `/api/v1`, JSON only. Errors always use the `ApiError` payload.
    * Authentication: `Authorization: Bearer <JWT>` (RS256). Claims: `sub`, `roles` (array), `tenant`, `scope`.
    * Tenant isolation: non-admin principals only see their own tenant; resources of another tenant answer 404.
      `PLATFORM_ADMIN` (tenant `*`) may scope with `X-Tenant-Id`.
    * `POST /messages` requires `Idempotency-Key`; replays answer 200 with `Idempotent-Replay: true`.
    * Delivery is asynchronous: 202 means *accepted for processing*, never *delivered*.
    * Every response carries `X-Correlation-Id` and `API-Version: 1`; rate limited requests carry `X-RateLimit-*`.
    * Paths marked "stage 2" (providers, ops, bulk jobs, callbacks, diagnostics, simulator) are part of the same
      contract and are implemented by the messaging/providers/callbacks/batch modules.
servers:
  - url: http://localhost:18080
    description: Local development (profile local)
tags:
  - name: Messages
  - name: Operations
  - name: Templates
  - name: Recipients
  - name: Audit and events
  - name: Providers
  - name: Queues
  - name: Bulk jobs
  - name: Diagnostics
  - name: Callbacks
  - name: Identity
  - name: Development
security:
  - bearerAuth: []
paths:
  /api/v1/messages:
    post:
      tags: [Messages]
      operationId: submitMessage
      summary: Submit a message for asynchronous delivery (idempotent)
      description: Roles SENDER, TENANT_ADMIN, PLATFORM_ADMIN. Policy rejections (opt-out, suppression, deleted recipient) are recorded as REJECTED messages with `statusReason`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitMessageRequest'
            examples:
              tradeConfirmation:
                summary: Transactional email with SMS fallback
                value:
                  clientReference: order-8841-confirm
                  recipientId: rcp-001
                  channel: EMAIL
                  category: TRANSACTIONAL
                  priority: NORMAL
                  template: {code: TRADE_CONFIRMATION, locale: en-US, version: null}
                  variables: {accountLast4: '1234', quantity: '10', symbol: ACME, price: '250.00'}
                  fallbackChannels: [SMS]
                  schedule: {sendAt: '2026-11-01T14:00:00Z', expiresAt: '2026-11-02T14:00:00Z'}
                  metadata: {source: brokerage-web}
      responses:
        '202':
          description: Accepted for processing
          headers:
            Location: {schema: {type: string}, description: URL of the new message}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAcceptedResponse'
              example:
                id: 6f1c2f64-2f0e-4c7e-9a52-0a5d1a3b9c11
                status: VALIDATED
                channel: EMAIL
                correlationId: 0b8f4a0e-6a77-4a5e-8d52-c3a1f7b2d9aa
                scheduledAt: null
                statusReason: null
                links: {self: /api/v1/messages/6f1c2f64-2f0e-4c7e-9a52-0a5d1a3b9c11}
        '200':
          description: Idempotent replay of an earlier identical request
          headers:
            Idempotent-Replay: {schema: {type: string, enum: ['true']}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAcceptedResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [Messages]
      operationId: listMessages
      summary: Search messages (filters, pagination, sorting)
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/MessageStatus'}}
        - {name: channel, in: query, schema: {$ref: '#/components/schemas/Channel'}}
        - {name: category, in: query, schema: {$ref: '#/components/schemas/Category'}}
        - {name: priority, in: query, schema: {$ref: '#/components/schemas/Priority'}}
        - {name: recipientId, in: query, schema: {type: string}}
        - {name: correlationId, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}, description: createdAt >= from}
        - {name: to, in: query, schema: {type: string, format: date-time}, description: createdAt < to}
        - {name: q, in: query, schema: {type: string}, description: Case-insensitive contains match on clientReference}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: sort, in: query, schema: {type: string, example: 'createdAt,desc'}, description: 'One of createdAt, updatedAt, status, priority, channel, scheduledAt, category'}
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: A page of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/messages/{id}:
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Message detail with attempts and delivery events (never content, masked address)
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Message detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/messages/{id}/status:
    get:
      tags: [Messages]
      operationId: getMessageStatus
      summary: Lightweight status
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatusResponse'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/messages/{id}/history:
    get:
      tags: [Messages]
      operationId: getMessageHistory
      summary: Lifecycle timeline (audit events, attempts and delivery events merged by time)
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEntry'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/messages/{id}/cancel:
    post:
      tags: [Messages]
      operationId: cancelMessage
      summary: Cancel a message that was not yet handed to a provider
      description: Allowed from VALIDATED, QUEUED, RETRY_PENDING. Roles SENDER, TENANT_ADMIN, OPERATOR, PLATFORM_ADMIN.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatusResponse'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/messages/{id}/requeue:
    post:
      tags: [Messages]
      operationId: requeueMessage
      summary: Operator requeue of a FAILED or DEAD_LETTERED message
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Requeued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatusResponse'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/dead-letters:
    get:
      tags: [Operations]
      operationId: listDeadLetters
      summary: Dead-lettered messages with the reason
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: sort, in: query, schema: {type: string}}
      responses:
        '200':
          description: A page of dead letters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterPage'
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/dead-letters/{messageId}/replay:
    post:
      tags: [Operations]
      operationId: replayDeadLetter
      summary: Operator replay of a dead letter (DEAD_LETTERED to QUEUED)
      parameters:
        - {name: messageId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatusResponse'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/dead-letters/{messageId}/discard:
    post:
      tags: [Operations]
      operationId: discardDeadLetter
      summary: Mark a dead letter as discarded (audited; status stays DEAD_LETTERED)
      parameters:
        - {name: messageId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscardRequest'
      responses:
        '200':
          description: Discarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatusResponse'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/failed-messages:
    get:
      tags: [Operations]
      operationId: listFailedMessages
      summary: Investigation list of FAILED, DELIVERY_UNKNOWN and RETRY_PENDING messages
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/MessageStatus'}}
        - {name: channel, in: query, schema: {$ref: '#/components/schemas/Channel'}}
        - {name: category, in: query, schema: {$ref: '#/components/schemas/Category'}}
        - {name: priority, in: query, schema: {$ref: '#/components/schemas/Priority'}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: sort, in: query, schema: {type: string}}
      responses:
        '200':
          description: A page of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/delivery-events:
    get:
      tags: [Audit and events]
      operationId: searchDeliveryEvents
      summary: Search normalised provider delivery events
      parameters:
        - {name: messageId, in: query, schema: {type: string}}
        - {name: providerId, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/DeliveryEventType'}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: applied, in: query, schema: {type: boolean}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: sort, in: query, schema: {type: string}}
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEventPage'
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/audit-events:
    get:
      tags: [Audit and events]
      operationId: searchAuditEvents
      summary: Search the append-only audit trail
      parameters:
        - {name: entityType, in: query, schema: {type: string, example: MESSAGE}}
        - {name: entityId, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: actor, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: sort, in: query, schema: {type: string}}
      responses:
        '200':
          description: A page of audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      summary: List templates with version summaries
      parameters:
        - {name: channel, in: query, schema: {$ref: '#/components/schemas/Channel'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/TemplateStatus'}, description: Templates having a version in this status}
        - {name: code, in: query, schema: {type: string}, description: Case-insensitive contains}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: sort, in: query, schema: {type: string}}
      responses:
        '200':
          description: A page of templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
    post:
      tags: [Templates]
      operationId: createTemplate
      summary: Create a template with its first DRAFT version
      description: Roles TEMPLATE_AUTHOR, TENANT_ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
            example:
              code: PASSWORD_RESET
              name: Password reset
              channel: EMAIL
              category: SECURITY_ALERT
              locale: en
              subject: Reset your password
              body: '<p>Use code {{code}} to reset your password. It expires in {{minutes|15}} minutes.</p>'
              variables: [code, minutes]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/templates/preview:
    post:
      tags: [Templates]
      operationId: previewTemplate
      summary: Render a template with sample data (nothing is sent or stored)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '200':
          description: Rendered output, or validation problems with `valid=false`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/templates/{id}:
    get:
      tags: [Templates]
      operationId: getTemplate
      summary: Template with all versions
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Template detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/templates/{id}/versions:
    post:
      tags: [Templates]
      operationId: createTemplateVersion
      summary: New DRAFT version or locale variant
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/templates/{id}/versions/{versionNo}:
    put:
      tags: [Templates]
      operationId: editTemplateVersion
      summary: Edit a DRAFT version (optimistic lock)
      description: '`version` in the body is the optimistic-lock token; an optional `If-Match` header must agree with it. The editor becomes the author of record.'
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionNo'
        - $ref: '#/components/parameters/Locale'
        - {name: If-Match, in: header, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVersionRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/templates/{id}/versions/{versionNo}/submit:
    post:
      tags: [Templates]
      operationId: submitTemplateVersion
      summary: DRAFT to PENDING_APPROVAL
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionNo'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/templates/{id}/versions/{versionNo}/approve:
    post:
      tags: [Templates]
      operationId: approveTemplateVersion
      summary: PENDING_APPROVAL to PUBLISHED (four-eyes)
      description: The approver must differ from the author of record (403 otherwise). The previously published version of the same locale becomes RETIRED.
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionNo'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/templates/{id}/versions/{versionNo}/reject:
    post:
      tags: [Templates]
      operationId: rejectTemplateVersion
      summary: PENDING_APPROVAL back to DRAFT with a comment
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionNo'
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/templates/{id}/versions/{versionNo}/retire:
    post:
      tags: [Templates]
      operationId: retireTemplateVersion
      summary: PUBLISHED to RETIRED
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionNo'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Retired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/templates/{id}/history:
    get:
      tags: [Templates]
      operationId: getTemplateHistory
      summary: Change history from the audit trail
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Audit entries in time order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/recipients:
    get:
      tags: [Recipients]
      operationId: searchRecipients
      summary: Search recipients (addresses are masked)
      parameters:
        - {name: q, in: query, schema: {type: string}, description: Contains match on externalRef, displayName or id}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: sort, in: query, schema: {type: string}}
      responses:
        '200':
          description: A page of recipients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPage'
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/recipients/{id}/preferences:
    get:
      tags: [Recipients]
      operationId: getPreferences
      summary: Consent and delivery preferences
      parameters:
        - $ref: '#/components/parameters/RecipientId'
      responses:
        '200':
          description: Preferences with the optimistic-lock `version`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Recipients]
      operationId: updatePreferences
      summary: Update preferences (stale `version` yields 409 CONFLICT_OPTIMISTIC_LOCK)
      parameters:
        - $ref: '#/components/parameters/RecipientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
            example:
              marketingOptIn: true
              emailEnabled: true
              smsEnabled: true
              pushEnabled: false
              quietStart: '22:00'
              quietEnd: '07:00'
              timeZone: America/New_York
              fallbackOrder: [SMS, EMAIL]
              version: 3
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/recipients/{id}/suppressions:
    post:
      tags: [Recipients]
      operationId: addSuppression
      summary: Suppress the recipient's address on one channel (blocks all categories)
      parameters:
        - $ref: '#/components/parameters/RecipientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressionRequest'
      responses:
        '201':
          description: Suppressed (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/recipients/{id}/suppressions/{channel}:
    delete:
      tags: [Recipients]
      operationId: removeSuppression
      summary: Lift a suppression
      parameters:
        - $ref: '#/components/parameters/RecipientId'
        - {name: channel, in: path, required: true, schema: {$ref: '#/components/schemas/Channel'}}
      responses:
        '204': {description: Removed}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/providers:
    get:
      tags: [Providers]
      operationId: listProviders
      summary: Provider health
      description: Roles OPERATOR, TENANT_ADMIN, PLATFORM_ADMIN. Circuit state comes from the per-provider circuit breaker, success rate and p95 latency from the `messaging.provider.*` meters (since process start / sliding window), `lastError` is the last non-accepted outcome as `OUTCOME:CODE`.
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderHealth'
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/providers/{providerId}/config:
    put:
      tags: [Providers]
      operationId: updateProviderConfig
      summary: Enable/disable a provider, change rate limit and timeout (PLATFORM_ADMIN)
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderConfigRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderHealth'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/providers/{providerId}/fault-mode:
    put:
      tags: [Providers]
      operationId: setProviderFaultMode
      summary: Set the simulator fault mode (PLATFORM_ADMIN, profiles local/test only)
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaultModeRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultModeRequest'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ops/queues:
