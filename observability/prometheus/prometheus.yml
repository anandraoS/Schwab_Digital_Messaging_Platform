# Prometheus config for the compose stack. Validated by parsing only (promtool not available on the authoring machine).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: messaging-platform

rule_files:
  - /etc/prometheus/recording-rules.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: messaging-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:18080"]
        labels: { service: messaging-backend }

  # Backend started locally with scripts/run-local.sh (port 18080) while Prometheus runs in compose.
  - job_name: messaging-backend-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:18080"]
        labels: { service: messaging-backend-local }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
